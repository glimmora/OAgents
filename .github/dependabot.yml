# Dependabot OAgents — hanya ekosistem yang dipakai repo ini.
# Tidak ada npm di sini (opencode/npm hanya di dalam rootfs runtime, bukan dependensi repo).
# Semua komentar dalam bahasa Indonesia.

version: 2
updates:
  # Action workflow GitHub Actions (checkout, setup-java, flutter-action, dll).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - github-actions
    # Bot PR tidak menjalankan job e2e/autofix khusus main — cukup gate murah.
    open-pull-requests-limit: 5

  # Gradle (android/*.gradle.kts + wrapper).
  - package-ecosystem: gradle
    directory: /android/
    schedule:
      interval: monthly
    commit-message:
      prefix: "build"
    labels:
      - dependencies
      - gradle
    open-pull-requests-limit: 5
