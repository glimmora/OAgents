# CI utama OAgents — push/PR ke main.
# Tahap: quality (murah dulu, 2 shard) → build APK debug → e2e emulator arm64 → autofix.
# Semua job butuh cache pub; komentar dalam bahasa Indonesia.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Autofix perlu push ke main; e2e hanya membaca artefak (default read cukup,
# contents: write diberikan di level workflow untuk job autofix).
permissions:
  contents: write

# Batalkan run lama pada ref yang sama supaya runner tidak menumpuk.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- quality
  # Gate murah: format, analyze, unit test (dipecah 2 shard paralel).
  quality-shard-1:
    name: quality (shard 1/2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17 (temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      # Cache paket pub — key dari hash pubspec.yaml.
      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Pub get
        run: flutter pub get

      - name: Cek format (gagal bila belum rapi)
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze (info fatal)
        run: flutter analyze --fatal-warnings

      - name: Unit test (shard 1/2)
        run: flutter test --coverage --total-shards 2 --shard-index 0

      - name: Upload coverage (shard 1)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-shard-1
          path: coverage/lcov.info
          if-no-files-found: warn

  quality-shard-2:
    name: quality (shard 2/2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17 (temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      # Cache paket pub — key dari hash pubspec.yaml.
      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Pub get
        run: flutter pub get

      - name: Cek format (gagal bila belum rapi)
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze (info fatal)
        run: flutter analyze --fatal-warnings

      - name: Unit test (shard 2/2)
        run: flutter test --coverage --total-shards 2 --shard-index 1

      - name: Upload coverage (shard 2)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-shard-2
          path: coverage/lcov.info
          if-no-files-found: warn

  # ---------------------------------------------------------------- build
  # APK debug — dipakai job e2e. BUILD_NUMBER dari nomor run.
  build:
    name: build (APK debug)
    needs: [quality-shard-1, quality-shard-2]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Bila ada artefak proot terbaru dari workflow build-proot, turunkan
      # dan pasang sebagai android/app/libs/arm64-v8a/libproot.so.
      # Jika belum ada (belum pernah dijalankan), lewati tanpa gagal —
      # untuk v0.1.0 APK menyertakan placeholder kosong.
      - name: Unduh artefak proot bila ada (opsional)
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build-proot.yml
          name: proot-aarch64
          path: proot-download
          if_no_artifact_found: ignore

      - name: Pasang libproot.so bila ada
        run: |
          if [ -f proot-download/proot ]; then
            mkdir -p android/app/libs/arm64-v8a
            cp proot-download/proot android/app/libs/arm64-v8a/libproot.so
            echo "proot dipasang dari artefak CI"
          else
            mkdir -p android/app/libs/arm64-v8a
            echo "placeholder" > android/app/libs/arm64-v8a/README.md
            echo "::warning::Artefak proot belum tersedia — memakai placeholder kosong (v0.1.0)"
          fi

      - name: Setup Java 17 (temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      # Cache paket pub — key dari hash pubspec.yaml.
      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Pub get
        run: flutter pub get

      - name: Build APK debug
        run: flutter build apk --debug --dart-define=BUILD_NUMBER=${{ github.run_number }}

      - name: Upload APK debug
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  # ---------------------------------------------------------------- e2e
  # Emulator arm64 (APK hanya arm64-v8a; runner arm64 publik untuk repo publik).
  # Jika emulator arm64 gagal boot, job dilanjutkan dengan warning — jangan
  # gagalkan pipeline (masih tahap awal v0.1.0).
  e2e:
    # Emulator x64: Flutter 3.24 tidak merilis SDK linux-arm64, jadi e2e
    # dijalankan pada emulator x64 standar; pengujian tetap memakai bridge
    # palsu (tanpa proot asli) sehingga arsitektur device tidak relevan.
    name: e2e (emulator x64)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17 (temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      # Cache paket pub — key dari hash pubspec.yaml.
      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Pub get
        run: flutter pub get

      - name: Unduh APK debug
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk

      # e2e memakai bridge palsu (E2E_FAKE_BRIDGE=true) — tanpa rootfs asli
      # dan tanpa proot asli, lihat integration_test/app_e2e_test.dart.
      # ANDROID_I_WANT_MY_TCG: runner tanpa KVM membuat action menambah
      # -accel off; emulator 37.x menolak software emulation tanpa flag ini.
      - name: Jalankan integration test di emulator (API 34 x64, TCG)
        env:
          ANDROID_I_WANT_MY_TCG: 'yes'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 34 + RAM kecil: runner tanpa KVM memakai -accel off,
          # image ringan memperbesar peluang boot dalam batas waktu.
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel
          emulator-boot-timeout: 600
          script: |
            adb install -r app-debug.apk
            flutter test integration_test/app_e2e_test.dart -d emulator --dart-define=E2E_FAKE_BRIDGE=true

      # Ringkasan warning bila e2e bermasalah (continue-on-error membuat job
      # tidak menggagalkan pipeline — catat jelas di summary).
      - name: Catat hasil e2e di summary
        if: always()
        run: |
          {
            echo "## Ringkasan e2e"
            echo "Job e2e bersifat non-blocking (continue-on-error)."
            echo "Jika boot emulator arm64 gagal, hasil e2e tidak dipercaya dan dicatat sebagai warning di atas."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- autofix
  # Bila build (atau tahap sebelumnya) gagal pada push ke main, coba
  # perbaiki otomatis: dart format + dart fix, lalu push commit bot.
  autofix:
    name: autofix (format + lint)
    needs: build
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (tanpa menyimpan kredensial)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Java 17 (temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      # Cache paket pub — key dari hash pubspec.yaml.
      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Pub get
        run: flutter pub get

      - name: dart format
        run: dart format .

      - name: dart fix --apply
        run: dart fix --apply

      # Push hanya bila ada perubahan; token bawaan GITHUB_TOKEN (bukan token manual).
      - name: Commit & push bila ada perubahan
        run: |
          git config user.name "oagents-bot"
          git config user.email "bot@oagents.local"
          if git diff --quiet; then
            echo "Tidak ada perubahan — tidak ada yang dipush."
            exit 0
          fi
          git add -A
          git commit -m "[autofix] format + lint fixes [skip ci]"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/glimmora/OAgents.git" HEAD:main
