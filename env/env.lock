# OAgents environment lock — versi terkunci untuk lingkungan runtime
# Perubahan versi harus lewat pull request yang menjalankan e2e penuh.

# opencode CLI — sumber: registry npm @opencode/cli
OPENCODE_VERSION=2.4.1

# Node.js di dalam rootfs Alpine
NODE_VERSION=22.11.0

# Rootfs Alpine (glibc-free, musl; opencode tersedia sebagai linux-arm64 musl)
# Terverifikasi 200 OK pada 2026-11-25
ROOTFS_URL=https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/aarch64/alpine-minirootfs-3.20.3-aarch64.tar.gz
ROOTFS_SHA256_URL=https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/aarch64/alpine-minirootfs-3.20.3-aarch64.tar.gz.sha256

# opencode binary langsung dari rilis GitHub (linux arm64 musl)
OPENCODE_BINARY_URL=https://github.com/anomalyco/opencode/releases/download/v2.4.1/opencode-linux-arm64-musl.tgz

# proot: dibangun dari source (proot-me/proot, master) oleh CI job build-proot
# pada runner linux-arm64 — asset statis tidak tersedia untuk aarch64.
PROOT_BUILD_REF=master

# Port server lokal (hanya 127.0.0.1)
OPENCODE_PORT=4096
