name: oagents
description: "OAgents — aplikasi Android agent AI dengan opencode CLI sebagai engine (client/server via proot Ubuntu/Alpine)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^9.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  markdown_widget: ^2.3.2+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
